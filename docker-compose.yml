volumes:
  pg_data:

services:
  application:
    build: .
    restart: always
    volumes:
      - ./app/:/app/app
      - ./.env:/app/.env
      - ./migrations/:/app/migrations
      - ./seeds/:/app/seeds
    depends_on:
      database:
        condition: service_healthy  # ← Ждём, пока БД точно запустится
    environment:
      POSTGRES_HOST: database
      POSTGRES_PORT: 5432

  database:
    image: postgres:16  # ← Конкретная версия, а не latest!
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:  # ← Проверка готовности БД
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
